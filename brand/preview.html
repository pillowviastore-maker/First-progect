<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Inter,sans-serif;background:#EEEFF3;padding:30px;width:1140px}
.row{display:flex;gap:24px;margin-bottom:24px}.card{flex:1;background:#fff;border-radius:16px;padding:24px;text-align:center}
.card.dark{background:#303D66}.card img{width:100%;}.n{font-weight:700;color:#303D66;font-size:22px;margin-bottom:12px;text-align:left}
</style></head><body>
<div class="row"><div class="card"><div class="n">1</div><img src="logo-1.svg"></div><div class="card"><div class="n">2</div><img src="logo-2.svg"></div><div class="card"><div class="n">3</div><img src="logo-3.svg"></div></div>
<div class="row"><div class="card dark"><img src="logo-1-white.svg"></div><div class="card dark"><img src="logo-2-white.svg"></div><div class="card dark"><img src="logo-3-white.svg"></div></div>
</body></html>
